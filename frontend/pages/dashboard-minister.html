<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vector Portal — Minister Dashboard</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/georgian-fonts.css" />
  <link rel="stylesheet" href="/css/apple.css" />
  <link rel="stylesheet" href="/css/dashboard-pipeline.css" />
  <style>
    /* Controls row: search + Completed/Upcoming toggle */
    .mn-controls {
      display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .mn-search { flex: 1; min-width: 200px; max-width: 360px; }
    .mn-search .form-label { font-size: 0.75rem; }
    .mn-toggle {
      display: inline-flex; border: 1px solid var(--border-color);
      border-radius: var(--radius-md); overflow: hidden; background: var(--bg-card);
    }
    .mn-toggle__btn {
      border: none; background: transparent; cursor: pointer;
      padding: 8px 18px; font-size: 0.85rem; font-weight: 600;
      color: var(--text-secondary);
    }
    .mn-toggle__btn.is-active { background: var(--accent, #2563eb); color: #fff; }

    /* Completed-card action row (Library actions inside a dashboard card) */
    .mn-card-actions {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px;
    }
    .mn-card-actions .btn { padding: 4px 10px; font-size: 12px; }

    /* Document preview / files modal (mirrors the Library page styles) */
    .preview-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 300;
    }
    .preview-card {
      background: var(--bg-card); border-radius: var(--radius-lg);
      width: 90%; max-width: 900px; max-height: 90vh; overflow-y: auto;
      padding: 32px; box-shadow: var(--shadow-lg);
    }
    .preview-card .section-block { margin-bottom: 24px; }
    .preview-card .section-block h3 {
      font-size: 0.95rem; border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px; margin-bottom: 12px;
    }
    .preview-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 12px;
    }
    .preview-header h2 { margin: 0; font-size: 1.1rem; }
    .preview-close {
      background: none; border: none; font-size: 24px;
      cursor: pointer; color: var(--text-secondary); padding: 4px 8px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <div class="page-title" data-i18n="dashboard.ministerTitle">Minister Dashboard</div>
      </div>

      <div class="mn-controls">
        <div class="form-group mn-search">
          <label class="form-label" data-i18n="library.filter.search">Search</label>
          <input class="form-input" id="filterKeyword" data-i18n-placeholder="dashboard.searchPlaceholder" placeholder="Search by title or country..." />
        </div>
        <div class="mn-toggle" role="tablist">
          <button type="button" class="mn-toggle__btn is-active" id="toggleCompleted" data-mode="completed" data-i18n="dashboard.toggleCompleted">Completed</button>
          <button type="button" class="mn-toggle__btn" id="toggleUpcoming" data-mode="upcoming" data-i18n="dashboard.toggleUpcoming">Upcoming</button>
        </div>
      </div>

      <div class="card dp-upcoming-card">
        <div class="dp-upcoming-layout">
          <div class="dp-calendar" id="miniCalendar"></div>
          <div class="dp-upcoming-list" id="cardList">
            <div class="empty-state"><p data-i18n="dashboard.noCompleted">No completed documents</p></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="/js/docx-export.js"></script>
  <script src="/js/core/config.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/dialog.js"></script>
  <script src="/js/core/app.js"></script>
  <script src="/js/core/library-doc.js"></script>
  <script src="/js/pages/dashboard-minister.js"></script>
</body>
</html>
