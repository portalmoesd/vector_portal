<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vector Portal — Minister Dashboard</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/georgian-fonts.css" />
  <link rel="stylesheet" href="/css/apple.css" />
  <link rel="stylesheet" href="/css/dashboard-pipeline.css" />
  <link rel="stylesheet" href="/css/dashboard-minister.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main mn-dash">
      <div class="mn-hero" id="mnHero">
        <div class="mn-hero__icon" id="mnHeroIcon"></div>
        <div class="mn-hero__text">
          <h1 class="mn-hero__greeting" id="mnGreeting" data-i18n="dashboard.ministerTitle">Minister Dashboard</h1>
          <p class="mn-hero__date" id="mnDate"></p>
        </div>
        <div class="mn-hero__clock">
          <span class="mn-hero__time" id="mnClock">--:--</span>
          <span class="mn-hero__tz" data-i18n="dashboard.tbilisi">Tbilisi</span>
        </div>
      </div>

      <div class="mn-overview">
        <div class="dp-calendar mn-overview__cal" id="miniCalendar"></div>
        <div class="mn-overview__side" id="mnSide"></div>
      </div>

      <div class="card mn-workspace">
        <div class="mn-toolbar">
          <div class="mn-toggle" role="tablist">
            <span class="mn-toggle__thumb" id="mnToggleThumb"></span>
            <button type="button" class="mn-toggle__btn is-active" id="toggleCompleted" data-mode="completed" data-i18n="dashboard.toggleCompleted">Completed</button>
            <button type="button" class="mn-toggle__btn" id="toggleUpcoming" data-mode="upcoming" data-i18n="dashboard.toggleUpcoming">In Progress</button>
          </div>
          <div class="mn-search">
            <svg class="mn-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input class="form-input" id="filterKeyword" data-i18n-placeholder="dashboard.searchPlaceholder" placeholder="Search by title or country..." />
          </div>
        </div>
        <div class="mn-list" id="cardList">
          <div class="empty-state"><p data-i18n="dashboard.noCompleted">No completed documents</p></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="/js/docx-export.js"></script>
  <script src="/js/core/config.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/dialog.js"></script>
  <script src="/js/core/app.js"></script>
  <script src="/js/core/section-history-view.js"></script>
  <script src="/js/core/library-doc.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="/js/simple-editor.js"></script>
  <script src="/js/core/event-create.js"></script>
  <script src="/js/core/templates-manager.js"></script>
  <script src="/js/pages/dashboard-minister.js"></script>
</body>
</html>
