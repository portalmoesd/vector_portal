<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vector Portal — Country Profile</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/statistics.css" />
  <link rel="stylesheet" href="/css/country-profiles.css" />
  <link rel="stylesheet" href="/css/georgian-fonts.css" />
  <link rel="stylesheet" href="/css/apple.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main cp-page cp-profile-page">
      <nav class="cp-breadcrumb" aria-label="Breadcrumb" id="cpBreadcrumb"></nav>

      <div id="cpLoading" class="stat-report__loading">
        <div class="stat-spinner"></div>
        <span class="stat-loading-label" data-i18n="common.loading">Loading...</span>
      </div>

      <div id="cpError" class="card cp-error hidden" role="alert"></div>

      <div id="cpProfile" class="hidden">
        <header class="card cp-header" id="cpHeader"></header>

        <div class="cp-tiles" id="cpTiles"></div>

        <div class="cp-body">
          <nav class="cp-toc card" id="cpToc" aria-labelledby="cpTocTitle">
            <div class="cp-toc__title" id="cpTocTitle" data-i18n="countryProfiles.onThisPage">On this page</div>
            <ol class="cp-toc__list" id="cpTocList"></ol>
          </nav>
          <div class="cp-sections" id="cpSections"></div>
        </div>

        <footer class="cp-footer" id="cpFooter"></footer>
      </div>
    </main>
  </div>
  <!-- Chart.js: the same build the statistics pages already load. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/js/core/config.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/app.js"></script>
  <script src="/assets/flags/flags.js"></script>
  <script src="/js/pages/country-profile.js"></script>
</body>
</html>
