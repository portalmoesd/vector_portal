<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vector Portal — Products</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/statistics.css" />
  <link rel="stylesheet" href="/css/country-comparison.css" />
  <link rel="stylesheet" href="/css/georgian-fonts.css" />
  <link rel="stylesheet" href="/css/apple.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <div class="page-title" id="pageTitle">Products</div>
      </div>

      <!-- Latest Statistics ⇄ Country Comparison ⇄ Products -->
      <div id="statModeSwitch" class="stat-mode-switch">
        <span class="stat-mode-switch__thumb" id="statModeThumb"></span>
        <a class="stat-mode-switch__btn" data-mode="latest" href="/pages/statistics.html">Latest Statistics</a>
        <a class="stat-mode-switch__btn" data-mode="comparison" href="/pages/country-comparison.html">Country Comparison</a>
        <a class="stat-mode-switch__btn active" data-mode="products" href="/pages/products.html">Products</a>
      </div>

      <!-- Controls: product + year + period + flow + language + generate -->
      <div class="card stat-controls">
        <div class="stat-controls__row">
          <div class="form-group stat-controls__country">
            <label class="form-label" id="productLabel">Product</label>
            <div class="stat-search-wrap">
              <input type="text" id="productSearch" class="form-input" placeholder="Product name or HS code..." autocomplete="off" />
              <div id="productDropdown" class="stat-dropdown hidden"></div>
            </div>
            <input type="hidden" id="productValue" />
          </div>
          <div class="form-group cmp-period-group">
            <label class="form-label" id="yearLabel">Year</label>
            <div class="cmp-period-row">
              <select id="prodYear" class="form-input cmp-select"></select>
            </div>
          </div>
          <div class="form-group cmp-period-group">
            <label class="form-label" id="periodLabel">Period</label>
            <div class="cmp-period-row">
              <select id="prodPeriodMode" class="form-input cmp-select"></select>
            </div>
          </div>
          <div class="form-group cmp-period-group">
            <label class="form-label" id="flowLabel">Flow</label>
            <div class="cmp-period-row">
              <select id="prodFlow" class="form-input cmp-select"></select>
            </div>
          </div>
          <div class="form-group stat-controls__btn-wrap">
            <label class="form-label">&nbsp;</label>
            <div class="stat-controls__buttons">
              <div class="stat-lang-toggle" id="reportLangToggle" role="radiogroup" aria-label="Report language">
                <button type="button" class="stat-lang-toggle__btn" data-report-lang="ka">ქართ</button>
                <button type="button" class="stat-lang-toggle__btn" data-report-lang="en">EN</button>
              </div>
              <button class="btn btn-primary" id="generateBtn" disabled data-i18n="statistics.generate">Generate</button>
            </div>
          </div>
        </div>
      </div>

      <div id="prodLoading" class="stat-report__loading hidden">
        <div class="stat-spinner"></div>
        <span class="stat-loading-label">Loading...</span>
      </div>

      <div id="prodSections" class="hidden">

        <!-- Summary overview -->
        <div id="prodSummary" class="card stat-summary hidden"></div>

        <!-- Export / import dynamics side by side -->
        <div class="stat-charts-row">
          <div class="card stat-chart-card" id="exportChartCard">
            <div id="exportChartHeader" class="stat-report__header"></div>
            <div class="cmp-chart-wrap"><canvas id="prodExportChart"></canvas></div>
          </div>
          <div class="card stat-chart-card" id="importChartCard">
            <div id="importChartHeader" class="stat-report__header"></div>
            <div class="cmp-chart-wrap"><canvas id="prodImportChart"></canvas></div>
          </div>
        </div>

        <!-- Top partners, exactly below the charts -->
        <div class="stat-charts-row">
          <div class="card stat-chart-card" id="exportDestCard">
            <div id="exportDestHeader" class="stat-report__header"></div>
            <div id="exportDestTable" class="table-wrap"></div>
          </div>
          <div class="card stat-chart-card" id="importOrigCard">
            <div id="importOrigHeader" class="stat-report__header"></div>
            <div id="importOrigTable" class="table-wrap"></div>
          </div>
        </div>

        <!-- Domestic export / re-export destinations -->
        <div class="stat-charts-row" id="subFlowsRow">
          <div class="card stat-chart-card" id="domExpCard">
            <div id="domExpHeader" class="stat-report__header"></div>
            <div id="domExpTable" class="table-wrap"></div>
          </div>
          <div class="card stat-chart-card" id="reExpCard">
            <div id="reExpHeader" class="stat-report__header"></div>
            <div id="reExpTable" class="table-wrap"></div>
          </div>
        </div>

      </div>

    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="/js/core/config.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/app.js"></script>
  <script src="/js/pages/products.js"></script>
</body>
</html>
